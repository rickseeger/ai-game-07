[project]
name = "g14-breach-flight"
version = "0.1.0"
description = "Linux 3D foundation for Breach Flight"
requires-python = ">=3.12,<3.13"
dependencies = ["panda3d==1.10.16"]
[project.scripts]
breach-flight = "breach.app:main"
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/breach"]
